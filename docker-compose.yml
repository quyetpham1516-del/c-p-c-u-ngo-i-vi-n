# Chạy thử toàn bộ hệ thống trên một máy: docker compose up --build
# Khi triển khai thật: đổi toàn bộ khóa bí mật, dùng PostgreSQL có sao lưu và bản sao dự phòng.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: medone
      POSTGRES_PASSWORD: medone
      POSTGRES_DB: medone
    volumes: [pgdata:/var/lib/postgresql/data]
  app:
    build: .
    depends_on: [db]
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgres://medone:medone@db:5432/medone
      MEDONE_WEB_DIST: /app/web/dist
      MEDONE_JWT_SECRET: doi-khoa-nay
      MEDONE_DATA_KEY: doi-khoa-nay-ma-hoa-cccd
      MEDONE_LOOKUP_KEY: doi-khoa-nay-tim-kiem-cccd
      MEDONE_TELEPHONY_KEY: doi-khoa-nay-tong-dai
volumes:
  pgdata:
